    <meta property="og:title" content="Tiếng Anh An Khê - Sentence Scramble" />
    <meta property="og:description" content="Trò chơi tương tác xếp từ thành câu tiếng Anh với bảng điểm nhóm, công cụ tạo bài tập mới tùy chỉnh cho giáo viên và bộ phát âm tùy chỉnh tốc độ, giọng đọc." />
    <script>
      // Prevent TypeError when libraries try to overwrite window.fetch in environments where it only has a getter
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchValue = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchValue;
            },
            set: function(val) {
              fetchValue = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Could not redefine window.fetch:", e);
        }
      })();
    </script>
